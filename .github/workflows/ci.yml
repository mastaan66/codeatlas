name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          # Belt and braces: tests clear this themselves, but never let a
          # repository secret leak into test runs.
          GEMINI_API_KEY: ''
